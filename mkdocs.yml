site_name: Guía de usuarios de JUPITER
site_description: Cluster de Física de Altas Energías del IFLP
repo_url: https://github.com/franaln/jupiter-guide
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Acceso: acceso.md
  - Almacenamiento: almacenamiento.md
  - Apptainer: apptainer.md
  - HTCondor: htcondor.md
  - Python, GPU y Jupyter: python-gpu.md
  - ROOT: root.md
  - ATLAS: atlas.md
  - Simulaciones: simulaciones.md
