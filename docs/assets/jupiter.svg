<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Minimal Jupiter: banded disc with the Great Red Spot -->
  <defs>
    <clipPath id="disc"><circle cx="32" cy="32" r="30"/></clipPath>
    <radialGradient id="shade" cx="35%" cy="30%" r="75%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.25"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#disc)">
    <rect width="64" height="64" fill="#efd9b8"/>
    <rect y="8"  width="64" height="6" fill="#d4a373"/>
    <rect y="19" width="64" height="7" fill="#b7744a"/>
    <rect y="30" width="64" height="3" fill="#e2bd8f"/>
    <rect y="38" width="64" height="7" fill="#b7744a"/>
    <rect y="50" width="64" height="5" fill="#d4a373"/>
    <ellipse cx="41" cy="41.5" rx="7" ry="3.6" fill="#c0503a"/>
    <circle cx="32" cy="32" r="30" fill="url(#shade)"/>
  </g>
</svg>
